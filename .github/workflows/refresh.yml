name: Refresh published Moto3 calendar
on:
  workflow_dispatch:
  schedule:
    - cron: '19 */3 * * *'
permissions:
  contents: write
concurrency:
  group: publish-calendar
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh calendar
        run: node refresh.mjs
      - name: Publish verified data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          git diff --cached --quiet || git commit -m "Refresh published Moto3 race times"
          git push
